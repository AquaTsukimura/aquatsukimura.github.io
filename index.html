<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Aqua Tsukimura | Eternal Star</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --ai-pink: #ff007a;
      --ai-purple: #7000ff;
      --ai-gold: #ffcc00;
      --bg-deep: #06040d;
      --glass: rgba(255, 255, 255, 0.03);
      --glass-border: rgba(255, 0, 122, 0.2);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Outfit', sans-serif;
      background-color: var(--bg-deep);
      background-image: 
        radial-gradient(circle at 10% 20%, rgba(112, 0, 255, 0.15) 0%, transparent 40%),
        radial-gradient(circle at 90% 80%, rgba(255, 0, 122, 0.15) 0%, transparent 40%);
      color: #fff;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      overflow-x: hidden;
    }

    .stars-container {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      z-index: -1;
      pointer-events: none;
    }

    .container {
      max-width: 850px;
      width: 100%;
      background: var(--glass);
      backdrop-filter: blur(25px);
      -webkit-backdrop-filter: blur(25px);
      border-radius: 40px;
      border: 1px solid var(--glass-border);
      padding: 50px;
      position: relative;
      box-shadow: 0 0 50px rgba(0, 0, 0, 0.8);
    }

    header h1 {
      font-size: 3.5rem;
      font-weight: 800;
      display: inline-block;
      cursor: default;
      background: linear-gradient(90deg, #fff, var(--ai-pink), var(--ai-purple), #fff);
      background-size: 200% auto;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      transition: all 0.5s ease;
      position: relative;
    }

    header h1::after {
      content: "★";
      position: absolute;
      right: -45px;
      top: 10px;
      font-size: 2.5rem;
      color: var(--ai-gold);
      opacity: 0;
      transition: all 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      filter: drop-shadow(0 0 15px var(--ai-gold));
    }

    header h1:hover {
      background-position: right center;
      transform: scale(1.02);
    }

    header h1:hover::after {
      opacity: 1;
      right: -55px;
      transform: rotate(360deg) scale(1.2);
    }

    h2 {
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 4px;
      color: var(--ai-pink);
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      gap: 15px;
      margin-top: 20px;
    }

    h2::after {
      content: "";
      height: 1px;
      flex-grow: 1;
      background: linear-gradient(90deg, var(--ai-pink), transparent);
    }

    .about p {
      font-size: 1.2rem;
      color: #ccc;
      font-weight: 300;
      line-height: 1.7;
    }

    .quote-container {
      margin: 40px 0;
      padding: 30px;
      background: rgba(0, 0, 0, 0.3);
      border-radius: 20px;
      border-left: 3px solid var(--ai-pink);
      min-height: 120px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    #quote-text {
      font-size: 1.2rem;
      font-style: italic;
      color: #eee;
      transition: opacity 0.5s ease;
    }

    #quote-author {
      font-size: 0.8rem;
      color: var(--ai-purple);
      margin-top: 10px;
      text-transform: uppercase;
      letter-spacing: 2px;
    }

    .fade-out { opacity: 0; }

    .icons-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(55px, 1fr));
      gap: 12px;
    }

    .icon-link {
      aspect-ratio: 1;
      background: rgba(255, 255, 255, 0.05);
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      display: flex;
      justify-content: center;
      align-items: center;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .icon-link:hover {
      transform: translateY(-5px) scale(1.1);
      border-color: var(--ai-pink);
      background: rgba(255, 0, 122, 0.1);
      box-shadow: 0 0 15px rgba(255, 0, 122, 0.3);
    }

    .icon-link img { width: 30px; height: 30px; }

    @media (max-width: 600px) {
      .container { padding: 30px; }
      header h1 { font-size: 2.5rem; }
      header h1::after { font-size: 1.8rem; right: -30px; }
      header h1:hover::after { right: -35px; }
    }
  </style>
</head>
<body>

<div class="stars-container" id="stars"></div>

<main class="container">
  <header>
    <h1>Aqua Tsukimura</h1>
  </header>

  <section class="about">
    <h2>The Profile</h2>
    <p>
      At 14, I balance the world of <strong>Full-Stack Development</strong> with an unyielding love for anime. 
      I create digital experiences that shine with the intensity of an idol under the spotlight.
    </p>

    <div class="quote-container">
      <p id="quote-text">"Lies are a refined form of love."</p>
      <p id="quote-author">— Ai Hoshino</p>
    </div>
  </section>

  <section class="tech">
    <h2>Tech Repertoire</h2>
    <div class="icons-grid">
      <a class="icon-link" href="#"><img src="https://skillicons.dev/icons?i=azure" alt="Azure" /></a>
      <a class="icon-link" href="#"><img src="https://skillicons.dev/icons?i=c" alt="C" /></a>
      <a class="icon-link" href="#"><img src="https://skillicons.dev/icons?i=cs" alt="C#" /></a>
      <a class="icon-link" href="#"><img src="https://skillicons.dev/icons?i=cpp" alt="C++" /></a>
      <a class="icon-link" href="#"><img src="https://skillicons.dev/icons?i=cloudflare" alt="Cloudflare" /></a>
      <a class="icon-link" href="#"><img src="https://skillicons.dev/icons?i=kafka" alt="Kafka" /></a>
      <a class="icon-link" href="#"><img src="https://skillicons.dev/icons?i=kotlin" alt="Kotlin" /></a>
      <a class="icon-link" href="#"><img src="https://skillicons.dev/icons?i=kubernetes" alt="Kubernetes" /></a>
      <a class="icon-link" href="#"><img src="https://skillicons.dev/icons?i=lua" alt="Lua" /></a>
      <a class="icon-link" href="#"><img src="https://skillicons.dev/icons?i=py" alt="Python" /></a>
      <a class="icon-link" href="#"><img src="https://skillicons.dev/icons?i=redis" alt="Redis" /></a>
      <a class="icon-link" href="#"><img src="https://skillicons.dev/icons?i=ts" alt="TypeScript" /></a>
      <a class="icon-link" href="#"><img src="https://skillicons.dev/icons?i=vscode" alt="VSCode" /></a>
    </div>
  </section>
</main>

<script>
  const quotes = [
    { text: "Lies are a refined form of love.", author: "Ai Hoshino" },
    { text: "I want to love someone for real.", author: "Ai Hoshino" },
    { text: "Lying is the best way to protect yourself.", author: "Ai Hoshino" },
    { text: "Even if it's a lie, I want to be someone who can say 'I love you'.", author: "Ai Hoshino" },
    { text: "A star is someone who shines the brightest in the dark.", author: "B-Komachi" }
  ];

  let currentQuote = 0;
  const quoteEl = document.getElementById('quote-text');
  const authorEl = document.getElementById('quote-author');

  function updateQuote() {
    quoteEl.classList.add('fade-out');
    
    setTimeout(() => {
      currentQuote = (currentQuote + 1) % quotes.length;
      quoteEl.textContent = `"${quotes[currentQuote].text}"`;
      authorEl.textContent = `— ${quotes[currentQuote].author}`;
      quoteEl.classList.remove('fade-out');
    }, 500);
  }

  setInterval(updateQuote, 5000);

  const starsContainer = document.getElementById('stars');
  for (let i = 0; i < 60; i++) {
    const star = document.createElement('div');
    star.style.position = 'absolute';
    star.style.left = `${Math.random() * 100}%`;
    star.style.top = `${Math.random() * 100}%`;
    star.style.width = '2px';
    star.style.height = '2px';
    star.style.background = 'white';
    star.style.opacity = Math.random();
    star.style.borderRadius = '50%';
    star.style.boxShadow = `0 0 ${Math.random() * 5}px white`;
    starsContainer.appendChild(star);
  }
</script>

</body>
</html>
