<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Aqua Tsukimura | Eternal Star</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --ai-pink: #ff007a;
      --ai-purple: #7000ff;
      --ai-gold: #ffcc00;
      --bg-deep: #06040d;
      --glass: rgba(255, 255, 255, 0.03);
      --glass-border: rgba(255, 0, 122, 0.2);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Outfit', sans-serif;
      background-color: var(--bg-deep);
      color: #fff;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      overflow: hidden;
      position: relative;
    }

    #star-field {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: -1;
      background: radial-gradient(circle at center, #1a0b2e 0%, #06040d 100%);
    }

    .star {
      position: absolute;
      bottom: -10px;
      background: var(--ai-pink);
      border-radius: 50%;
      opacity: 0.6;
      filter: blur(1px);
      animation: rise linear infinite;
    }

    @keyframes rise {
      from { transform: translateY(0); opacity: 0.8; }
      to { transform: translateY(-110vh); opacity: 0; }
    }

    .container {
      max-width: 850px;
      width: 100%;
      background: var(--glass);
      backdrop-filter: blur(30px);
      -webkit-backdrop-filter: blur(30px);
      border-radius: 40px;
      border: 1px solid var(--glass-border);
      padding: 50px;
      position: relative;
      box-shadow: 0 0 60px rgba(0, 0, 0, 0.8);
      z-index: 1;
    }

    header {
      display: flex;
      align-items: center;
      gap: 20px;
      margin-bottom: 10px;
    }

    .pfp {
      width: 75px;
      height: 75px;
      border-radius: 50%;
      border: 2px solid var(--ai-pink);
      box-shadow: 0 0 15px rgba(255, 0, 122, 0.4);
      object-fit: cover;
    }

    header h1 {
      font-size: 3.5rem;
      font-weight: 800;
      display: inline-block;
      cursor: default;
      background: linear-gradient(90deg, #fff, var(--ai-pink), var(--ai-purple), #fff);
      background-size: 200% auto;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      transition: all 0.5s ease;
      position: relative;
      animation: shimmer 4s linear infinite;
    }

    @keyframes shimmer {
      to { background-position: 200% center; }
    }

    header h1::after {
      content: "★";
      position: absolute;
      right: -45px;
      top: 10px;
      font-size: 2.5rem;
      color: var(--ai-gold);
      opacity: 0;
      transition: all 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      filter: drop-shadow(0 0 15px var(--ai-gold));
    }

    header h1:hover::after {
      opacity: 1;
      right: -60px;
      transform: rotate(360deg) scale(1.3);
    }

    h2 {
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 4px;
      color: var(--ai-pink);
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      gap: 15px;
      margin-top: 20px;
    }

    h2::after {
      content: "";
      height: 1px;
      flex-grow: 1;
      background: linear-gradient(90deg, var(--ai-pink), transparent);
    }

    .about p {
      font-size: 1.2rem;
      color: #ccc;
      font-weight: 300;
      line-height: 1.7;
    }

    .quote-container {
      margin: 40px 0;
      padding: 30px;
      background: rgba(0, 0, 0, 0.4);
      border-radius: 20px;
      border-left: 3px solid var(--ai-pink);
      min-height: 120px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      box-shadow: inset 0 0 20px rgba(255, 0, 122, 0.05);
    }

    #quote-text {
      font-size: 1.2rem;
      font-style: italic;
      color: #eee;
      transition: opacity 0.5s ease;
    }

    #quote-author {
      font-size: 0.8rem;
      color: var(--ai-purple);
      margin-top: 10px;
      text-transform: uppercase;
      letter-spacing: 2px;
    }

    .fade-out { opacity: 0; }

    .icons-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(55px, 1fr));
      gap: 12px;
    }

    .icon-link {
      aspect-ratio: 1;
      background: rgba(255, 255, 255, 0.05);
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      display: flex;
      justify-content: center;
      align-items: center;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .icon-link:hover {
      transform: translateY(-8px) scale(1.1);
      border-color: var(--ai-pink);
      background: rgba(255, 0, 122, 0.15);
      box-shadow: 0 0 20px rgba(255, 0, 122, 0.4);
    }

    .icon-link img { width: 32px; height: 32px; }

    @media (max-width: 600px) {
      .container { padding: 30px; }
      header h1 { font-size: 2.2rem; }
      header h1::after { font-size: 1.5rem; right: -25px; }
    }
  </style>
</head>
<body>

<div id="star-field"></div>

<main class="container">
  <header>
    <img src="https://cdn.discordapp.com/avatars/1474319584134697117/71daebb87416096b29240dde8095995b.png?size=4096" class="pfp" alt="Aqua PFP">
    <h1>Aqua Tsukimura</h1>
  </header>

  <section class="about">
    <h2>The Profile</h2>
    <p>
      At 14, I balance the world of <strong>Full-Stack Development</strong> with an unyielding love for anime. 
      I create digital experiences that shine with the intensity of an idol under the spotlight.
    </p>

    <div class="quote-container">
      <p id="quote-text">"Lies are a refined form of love."</p>
      <p id="quote-author">— Ai Hoshino</p>
    </div>
  </section>

  <section class="tech">
    <h2>Tech Repertoire</h2>
    <div class="icons-grid">
      <a class="icon-link" href="#"><img src="https://skillicons.dev/icons?i=azure" alt="Azure" /></a>
      <a class="icon-link" href="#"><img src="https://skillicons.dev/icons?i=c" alt="C" /></a>
      <a class="icon-link" href="#"><img src="https://skillicons.dev/icons?i=cs" alt="C#" /></a>
      <a class="icon-link" href="#"><img src="https://skillicons.dev/icons?i=cpp" alt="C++" /></a>
      <a class="icon-link" href="#"><img src="https://skillicons.dev/icons?i=cloudflare" alt="Cloudflare" /></a>
      <a class="icon-link" href="#"><img src="https://skillicons.dev/icons?i=kafka" alt="Kafka" /></a>
      <a class="icon-link" href="#"><img src="https://skillicons.dev/icons?i=kotlin" alt="Kotlin" /></a>
      <a class="icon-link" href="#"><img src="https://skillicons.dev/icons?i=kubernetes" alt="Kubernetes" /></a>
      <a class="icon-link" href="#"><img src="https://skillicons.dev/icons?i=lua" alt="Lua" /></a>
      <a class="icon-link" href="#"><img src="https://skillicons.dev/icons?i=py" alt="Python" /></a>
      <a class="icon-link" href="#"><img src="https://skillicons.dev/icons?i=redis" alt="Redis" /></a>
      <a class="icon-link" href="#"><img src="https://skillicons.dev/icons?i=ts" alt="TypeScript" /></a>
      <a class="icon-link" href="#"><img src="https://skillicons.dev/icons?i=vscode" alt="VSCode" /></a>
    </div>
  </section>
</main>

<script>
  const quotes = [
    { text: "Lies are a refined form of love.", author: "Ai Hoshino" },
    { text: "I want to love someone for real.", author: "Ai Hoshino" },
    { text: "Lying is the best way to protect yourself.", author: "Ai Hoshino" },
    { text: "Even if it's a lie, I want to be someone who can say 'I love you'.", author: "Ai Hoshino" },
    { text: "A star is someone who shines the brightest in the dark.", author: "B-Komachi" }
  ];

  let currentQuote = 0;
  const quoteEl = document.getElementById('quote-text');
  const authorEl = document.getElementById('quote-author');

  function updateQuote() {
    quoteEl.classList.add('fade-out');
    setTimeout(() => {
      currentQuote = (currentQuote + 1) % quotes.length;
      quoteEl.textContent = `"${quotes[currentQuote].text}"`;
      authorEl.textContent = `— ${quotes[currentQuote].author}`;
      quoteEl.classList.remove('fade-out');
    }, 500);
  }

  setInterval(updateQuote, 5000);

  const starField = document.getElementById('star-field');
  function createStar() {
    const star = document.createElement('div');
    star.className = 'star';
    const size = Math.random() * 4 + 1;
    star.style.width = `${size}px`;
    star.style.height = `${size}px`;
    star.style.left = `${Math.random() * 100}vw`;
    star.style.animationDuration = `${Math.random() * 3 + 2}s`;
    star.style.opacity = Math.random();
    
    starField.appendChild(star);
    
    setTimeout(() => {
      star.remove();
    }, 5000);
  }

  setInterval(createStar, 100);
</script>

</body>
</html>
